name: Build and Release
permissions:
  actions: read
  contents: write

on:
  workflow_dispatch:
    inputs:
      linux:
        type: boolean
        description: Linux (GCC)
        default: false
      linux_clang:
        type: boolean
        description: Linux (Clang)
        default: false
      windows:
        type: boolean
        description: Windows
        default: true
      macOS:
        type: boolean
        description: macOS
        default: false

  push:
    paths:
      - 'assets/**'
      - 'source/**'
      - 'toolchains/**'
      - 'triplets/**'
    branches:
      - '*' 

  pull_request:
    paths:
      - 'assets/**'
      - 'source/**'
      - 'toolchains/**'
      - 'triplets/**'
    branches:
      - '*'

jobs:
  # Windows
  build_windows:
    name: Build OpenStarbound Windows x64
    runs-on: windows-latest
    # Run on push and on workflow_dispatch (we will decide inside the job whether to actually build or create placeholders)
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Decide whether to build
        id: decide
        shell: pwsh
        run: |
          $do = 'true'
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ github.event.inputs.windows }}' -ne 'true') { $do = 'false' }
          echo "do_build=$do" >> $env:GITHUB_OUTPUT

      - name: Create placeholders for Windows (when not selected)
        if: ${{ steps.decide.outputs.do_build == 'false' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          "Placeholder OpenStarbound-Windows-All-DevOnly" | Out-File -FilePath OpenStarbound-Windows-All-DevOnly.zip -Encoding utf8
          "Placeholder OpenStarbound-Windows-Client" | Out-File -FilePath OpenStarbound-Windows-Client.zip -Encoding utf8
          "Placeholder OpenStarbound-Windows-Server" | Out-File -FilePath OpenStarbound-Windows-Server.zip -Encoding utf8
          New-Item -ItemType Directory -Path installer -Force | Out-Null
          "" | Out-File -FilePath installer/OpenStarbound-Windows-Installer.exe -Encoding utf8

      # The real build steps run only when do_build == true
      - name: Checkout
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install CMake & Ninja
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.29.2

      - name: Install Ninja (choco)
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        shell: cmd
        run: choco install ninja -y

      - name: Setup LLVM
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - name: setup 7-Zip
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        uses: milliewalky/setup-7-zip@v2

      - name: sccache
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: ${{ github.job }}-${{ runner.os }}
          max-size: 1000M

      - name: vcpkg
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgJsonGlob: '**/source/vcpkg.json'
          vcpkgConfigurationJsonGlob: '**/source/vcpkg-configuration.json'

      - name: Run CMake
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        uses: lukka/run-cmake@v10
        env:
          LLVMInstallDir: ${{ env.LLVM_PATH }}
          llvmX64: ${{ env.LLVM_PATH }}
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/source/CMakeLists.txt'
          configurePreset: 'windows-release-ci'
          buildPreset: 'windows-release-ci'
          testPreset: 'windows-release-ci'

      - name: Run Post-Build Task
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        working-directory: ${{ github.workspace }}
        run: scripts\ci\windows\post_build.bat

      - name: Assemble Files
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        working-directory: ${{ github.workspace }}
        run: |
          scripts/ci/windows/assemble.bat
          ren client.zip OpenStarbound-Windows-Client.zip
          ren server.zip OpenStarbound-Windows-Server.zip

      - name: Prepare Artifacts
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        working-directory: ${{ github.workspace }}
        run: |
          7z -bb3 -mtp=2 -mm=Deflate64 -mx=9 a dist.zip -r dist\
          ren dist.zip OpenStarbound-Windows-All-DevOnly.zip

      # Always collect vcpkg manifest log (if build ran it will contain details; if not present we still produce a small file)
      - name: Collect vcpkg log
        if: always()
        shell: pwsh
        run: |
          $logPath = Join-Path $PWD 'build\windows-release\vcpkg-manifest-install.log'
          if (Test-Path $logPath) {
            Copy-Item $logPath -Destination vcpkg-manifest-install.log -Force
          } else {
            "No vcpkg manifest log found on runner." | Out-File vcpkg-manifest-install.log -Encoding utf8
          }

      - name: Upload vcpkg log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-manifest-install-log-windows
          path: vcpkg-manifest-install.log
          archive: false

      # Upload artifact steps (these will upload either real build outputs or placeholder files)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenStarbound-Windows-All-DevOnly
          path: OpenStarbound-Windows-All-DevOnly.zip
          archive: false

      - name: Upload Client
        uses: actions/upload-artifact@v4
        with:
          name: OpenStarbound-Windows-Client
          path: OpenStarbound-Windows-Client.zip
          archive: false

      - name: Upload Server
        uses: actions/upload-artifact@v4
        with:
          name: OpenStarbound-Windows-Server
          path: OpenStarbound-Windows-Server.zip
          archive: false
          
      - name: Install Inno Setup
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        run: |
          echo "Checking pre-installation..."
          
          set "ISCC_PATH=%programfiles%\Inno Setup 7\ISCC.exe"
          
          if exist "%ISCC_PATH%" (
            echo ::warning::Inno Setup is already installed
            exit /b 0
          )
          
          echo "Downloading Inno Setup..."
  
          set "_url_=https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe"
          set "_file_=innosetup.exe"
  
          curl -L -o "%tmp%\%_file_%" "%_url_%"
          
          echo "Installing Inno Setup..."
          "%tmp%\%_file_%" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
          
          if not exist "%ISCC_PATH%" (
            echo "::error::Inno Setup installation failed"
            exit 1
          )
          
          echo ::warning::Inno Setup installed successfully!
        shell: cmd

      - name: Create Installer
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        working-directory: ${{ github.workspace }}
        run: |
          & "C:\Program Files\Inno Setup 7\iscc.exe" /Oinstaller scripts\inno\setup.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenStarbound-Windows-Installer
          path: installer/OpenStarbound-Windows-Installer.exe
          archive: true
          compression-level: 0

  # Linux GCC
  build_linux:
    name: Build OpenStarbound Linux x86_64
    runs-on: ubuntu-22.04
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Decide whether to build
        id: decide
        shell: bash
        run: |
          do_build=true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.linux }}" != "true" ]; then
            do_build=false
          fi
          echo "do_build=$do_build" >> $GITHUB_OUTPUT

      - name: Create placeholders for Linux (when not selected)
        if: ${{ steps.decide.outputs.do_build == 'false' }}
        shell: bash
        run: |
          mkdir -p dist
          echo "Placeholder" > OpenStarbound-Linux-GCC.tar.lz
          echo "Placeholder" > OpenStarbound-Linux-GCC-Client.tar.lz
          echo "Placeholder" > OpenStarbound-Linux-GCC-Server.tar.lz

      - name: Install Packages
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkgconf libxmu-dev libgl-dev libglu1-mesa-dev libasound2-dev libpulse-dev \
          libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
          libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
          libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev \
          autoconf autoconf-archive automake libtool patchelf tarlz

      - name: Install CMake & Ninja
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.29.2

      - uses: actions/checkout@v4
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        with:
          submodules: 'recursive'

      - name: sccache
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: ${{ github.job }}-${{ runner.os }}
          max-size: 250M

      - name: vcpkg
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgJsonGlob: '**/source/vcpkg.json'
          vcpkgConfigurationJsonGlob: '**/source/vcpkg-configuration.json'

      - name: Restore vcpkg cache
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        id: vcpkg-cache
        uses: TAServers/vcpkg-cache@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CMake
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        uses: lukka/run-cmake@v10
        env:
          VCPKG_FEATURE_FLAGS: "binarycaching"
          VCPKG_BINARY_SOURCES: "clear;files,${{ steps.vcpkg-cache.outputs.path }},readwrite"
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/source/CMakeLists.txt'
          configurePreset: 'linux-release'
          buildPreset: 'linux-release'

      - name: Prepare Artifacts
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        working-directory: ${{ github.workspace }}
        run: tarlz -c9vf OpenStarbound-Linux-GCC.tar.lz dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenStarbound-Linux-GCC
          path: OpenStarbound-Linux-GCC.tar.lz
          archive: false

      - name: Run Tests
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        uses: lukka/run-cmake@v10
        env:
          VCPKG_FEATURE_FLAGS: "binarycaching"
          VCPKG_BINARY_SOURCES: "clear;files,${{ steps.vcpkg-cache.outputs.path }},readwrite"
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/source/CMakeLists.txt'
          testPreset: 'linux-release'

      - name: Assemble Files
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        working-directory: ${{ github.workspace }}
        run: |
          scripts/ci/linux/assemble.sh
          mv -v client.tar.lz OpenStarbound-Linux-GCC-Client.tar.lz
          mv -v server.tar.lz OpenStarbound-Linux-GCC-Server.tar.lz

      - name: Upload Client Files
        uses: actions/upload-artifact@v4
        with:
          name: OpenStarbound-Linux-GCC-Client
          path: OpenStarbound-Linux-GCC-Client.tar.lz
          archive: false

      - name: Upload Server Files
        uses: actions/upload-artifact@v4
        with:
          name: OpenStarbound-Linux-GCC-Server
          path: OpenStarbound-Linux-GCC-Server.tar.lz
          archive: false

      - name: Collect vcpkg log
        if: always()
        run: |
          log='build/linux-release/vcpkg-manifest-install.log'
          if [ -f "$log" ]; then cp "$log" vcpkg-manifest-install.log; else echo "No vcpkg manifest log found." > vcpkg-manifest-install.log; fi

      - name: Upload vcpkg log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-manifest-install-log-linux
          path: vcpkg-manifest-install.log
          archive: false

  # Linux Clang (similar pattern)
  build_linux_clang:
    name: Build OpenStarbound Linux Clang x86_64
    runs-on: ubuntu-22.04
    if: ${{ github.event_name != 'pull_request' }}
