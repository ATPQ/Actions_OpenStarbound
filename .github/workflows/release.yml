name: Release

on:
  # Auto: trigger whenever the Build workflow finishes.
  workflow_run:
    workflows: ["Build"]
    types: [completed]

  # Manual: nothing required, resolves the latest successful Build run automatically.
  workflow_dispatch:
    inputs:
      run_id:
        description: '[optional] Build run id or URL (blank = latest successful Build run)'
        required: false
        default: ''
        type: string
      tag:
        description: '[optional] Custom release tag (blank = auto-generated)'
        required: false
        default: ''
        type: string
      draft:
        description: '[optional] Create as draft'
        required: false
        default: false
        type: boolean
      prerelease:
        description: '[optional] Mark as prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

# Serialize releases so an automatic and a manual run cannot race for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # workflow_run entry: upstream must have succeeded, come from push/dispatch, and target the default branch.
    # workflow_dispatch entry: always allowed.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (
        github.event.workflow_run.conclusion == 'success'
        && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
        && github.event.workflow_run.head_branch == 'main'
      )
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RAW_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      # ---------------------------------------------------------------- resolve upstream run
      - name: Resolve upstream Build run
        id: run
        shell: bash
        env:
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          run_id=""

          if [ '${{ github.event_name }}' = 'workflow_run' ]; then
            # Triggered by the Build workflow itself: use the run id from the event payload.
            run_id="${RAW_RUN_ID}"
          elif [ -n "${INPUT_RUN_ID}" ]; then
            # Manual entry with an explicit run: accept a bare id or a full run URL.
            run_id="${INPUT_RUN_ID##*/}"
            echo "Using manually specified run: ${run_id}"
          else
            # Manual entry without input: look up the latest successful Build run.
            echo "No run specified, resolving the latest successful Build run..."
            wf_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows" \
                      --jq '.workflows[] | select(.name == "Build") | .id' | head -n 1)
            if [ -z "${wf_id}" ]; then
              echo "::error::No workflow named 'Build' found. Check the name: field in build.yml"
              exit 1
            fi
            run_id=$(gh api \
                        "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf_id}/runs?status=success&per_page=1" \
                        --jq '.workflow_runs[0].id // empty')
            if [ -z "${run_id}" ]; then
              echo "::error::No successful Build run available to publish"
              exit 1
            fi
          fi

          if ! [[ "${run_id}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid run id: ${run_id}"
            exit 1
          fi

          json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
          conclusion=$(jq -r '.conclusion // "unknown"' <<<"${json}")
          sha=$(jq -r '.head_sha' <<<"${json}")
          branch=$(jq -r '.head_branch // ""' <<<"${json}")
          event=$(jq -r '.event' <<<"${json}")
          url=$(jq -r '.html_url' <<<"${json}")
          msg=$(jq -r '.head_commit.message // ""' <<<"${json}")

          # Auto entry must only publish successful builds; an explicit manual run may override.
          if [ "${conclusion}" != "success" ]; then
            if [ '${{ github.event_name }}' = 'workflow_dispatch' ] && [ -n "${INPUT_RUN_ID}" ]; then
              echo "::warning::Target run concluded with '${conclusion}', continuing on manual request"
            else
              echo "::error::Target run concluded with '${conclusion}', aborting"
              exit 1
            fi
          fi

          # Abort only when the run produced nothing at all; partial availability is handled later.
          count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '.total_count')
          if [ "${count}" -eq 0 ]; then
            echo "::error::Target run has no artifacts, nothing to publish"
            exit 1
          fi

          {
            echo "run_id=${run_id}"
            echo "sha=${sha}"
            echo "branch=${branch}"
            echo "event=${event}"
            echo "conclusion=${conclusion}"
            echo "url=${url}"
            echo "artifact_count=${count}"
            # Commit messages are multi-line, so use a delimiter.
            delim="MSG_$(date +%s%N)"
            echo "message<<${delim}"
            printf '%s\n' "${msg}"
            echo "${delim}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### Upstream Build run"
            echo ""
            echo "| key | value |"
            echo "|---|---|"
            echo "| entry | \`${{ github.event_name }}\` |"
            echo "| run | ${url} |"
            echo "| id | ${run_id} |"
            echo "| conclusion | ${conclusion} |"
            echo "| event | ${event} |"
            echo "| branch | ${branch} |"
            echo "| commit | \`${sha}\` |"
            echo "| artifacts | ${count} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      # ---------------------------------------------------------------- packaging tools
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y lzip zip unzip

      # ---------------------------------------------------------------- download client/server artifacts
      - name: Download client/server artifacts
        id: download
        shell: bash
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -uo pipefail
          mkdir -p downloads artifacts
          : > omitted.txt

          # Artifact naming in this repo:
          #   archive: false -> raw single file, artifact name already carries the extension
          #   archive: true  -> zip container, artifact name has no extension, file lives inside
          # Therefore: select by suffix, and only unpack when the name has no known extension.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | [.id, .name] | @tsv' > /tmp/artifacts.tsv

          echo "Artifacts available in run ${RUN_ID}:"
          cut -f2 /tmp/artifacts.tsv | sed 's/^/  - /'

          downloaded=0
          while IFS=$'\t' read -r id name; do
            [ -n "${name}" ] || continue

            # Publish client / server / installer only; skip dev bundles and full dist archives.
            case "${name}" in
              *DevOnly*) echo "skip (not published): ${name}"; continue ;;
              *-Client|*-Client.zip|*-Client.tar.lz) ;;
              *-Server|*-Server.zip|*-Server.tar.lz) ;;
              *-Installer|*-Installer.exe|*-Installer.zip) ;;
              *) echo "skip (full archive): ${name}"; continue ;;
            esac

            dest="downloads/${name}"
            mkdir -p "${dest}"

            ok=0
            for attempt in 1 2 3 4 5; do
              echo "::group::${name} (attempt ${attempt})"
              # Download by artifact id: works for both raw single-file and zip-container artifacts.
              if curl -sSfL --retry 3 --retry-delay 5 --retry-all-errors \
                   -H "Authorization: Bearer ${GH_TOKEN}" \
                   -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
                   -o /tmp/artifact.bin; then
                case "${name}" in
                  *.zip|*.tar.lz|*.tar.gz|*.tgz|*.7z|*.exe|*.dmg)
                    # Raw file artifact: keep the bytes exactly as uploaded.
                    cp /tmp/artifact.bin "${dest}/${name}"
                    ;;
                  *)
                    if [ "$(head -c 2 /tmp/artifact.bin)" = "PK" ]; then
                      # Zip container artifact: unpack the payload.
                      unzip -o -q /tmp/artifact.bin -d "${dest}"
                    else
                      cp /tmp/artifact.bin "${dest}/${name}"
                    fi
                    ;;
                esac
                rm -f /tmp/artifact.bin
                ok=1
                echo "::endgroup::"
                break
              fi
              echo "::endgroup::"
              echo "::warning::Download of '${name}' failed (${attempt}/5), retrying"
              sleep $((attempt * 15))
            done

            if [ "${ok}" -ne 1 ]; then
              echo "::error::Download of '${name}' failed after 5 attempts - excluding it from the release"
              echo "${name} (download failed)" >> omitted.txt
              continue
            fi

            downloaded=$((downloaded + 1))
          done < /tmp/artifacts.tsv

          # Flatten every layout into a single directory: artifacts/<real file name>.
          find downloads -type f -exec cp -ft artifacts/ {} +

          echo "Collected files:"
          ls -l artifacts/

          {
            echo "downloaded=${downloaded}"
            echo "omitted<<EOF_OMITTED"
            cat omitted.txt
            echo "EOF_OMITTED"
          } >> "${GITHUB_OUTPUT}"

          if [ "${downloaded}" -eq 0 ]; then
            echo "::error::No artifact could be downloaded, nothing to publish"
            exit 1
          fi


      # ---------------------------------------------------------------- tag
      - name: Determine release tag
        id: tag
        shell: bash
        env:
          CUSTOM_TAG: ${{ inputs.tag }}
          # Base version always comes from upstream, never from this repository,
          # so the appended timestamp can never accumulate across releases.
          UPSTREAM_REPO: OpenStarbound/OpenStarbound
          FALLBACK_VERSION: '0.1.14'
        run: |
          set -euo pipefail

          if [ -n "${CUSTOM_TAG}" ]; then
            tag="${CUSTOM_TAG}"
            echo "Using custom tag: ${tag}"
          else
            base=""
            for attempt in 1 2 3; do
              base=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" \
                       --jq '.tag_name // empty' 2>/dev/null) || base=""
              if [ -n "${base}" ]; then
                break
              fi
              echo "::warning::Could not read the latest upstream release (attempt ${attempt}/3)"
              sleep $((attempt * 5))
            done

            if [ -z "${base}" ]; then
              base="${FALLBACK_VERSION}"
              echo "::warning::Falling back to base version ${base}"
            fi

            stamp=$(date -u +%Y%m%d%H%M%S)
            tag="${base}.${stamp}"
            echo "Upstream base: ${base}"
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag already exists: ${tag}"
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Release tag: ${tag}"

      # ---------------------------------------------------------------- package
      - name: Package artifacts as .zip
        id: convert
        shell: bash
        run: |
          set -uo pipefail
          root="$(pwd)"
          mkdir -p release-zips
          shopt -s nullglob

          for src in artifacts/*; do
            base=$(basename "${src}")

            case "${base}" in
              *.tar.lz) dest="${base%.tar.lz}.zip" ;;
              *.exe)    dest="${base%.exe}.zip" ;;
              *.zip)    dest="${base}" ;;
              *) echo "::warning::Unrecognised file '${base}', skipping"; continue ;;
            esac

            echo "Packaging ${base} -> ${dest}"

            # Package inside a subshell so a corrupt archive only skips that one file.
            if ( set -e
                 tmp=$(mktemp -d)
                 trap 'rm -rf "${tmp}"' EXIT
                 case "${base}" in
                   *.tar.lz)
                     tar --lzip -xf "${src}" -C "${tmp}"
                     ( cd "${tmp}" && zip -r -q "${root}/release-zips/${dest}" . )
                     ;;
                   *.exe)
                     zip -j -q "release-zips/${dest}" "${src}"
                     ;;
                   *.zip)
                     cp "${src}" "release-zips/${dest}"
                     ;;
                 esac ); then
              continue
            fi

            echo "::error::Failed to package '${base}' - excluding it from the release"
            echo "${dest} (packaging failed)" >> omitted.txt
          done

          # Only abort when nothing at all was packaged.
          if ! ls release-zips/*.zip >/dev/null 2>&1; then
            echo "::error::No package could be produced, aborting"
            exit 1
          fi

          ls -lh release-zips/

          {
            echo "omitted<<EOF_OMITTED"
            cat omitted.txt
            echo "EOF_OMITTED"
          } >> "${GITHUB_OUTPUT}"

      # ---------------------------------------------------------------- mandatory gate
      - name: Verify mandatory packages
        shell: bash
        env:
          # Windows is the minimum publishable target.
          # Add "OpenStarbound-Windows-Installer.zip" here to make the installer mandatory too,
          # but note it depends on downloading/installing Inno Setup at build time.
          REQUIRED: |
            OpenStarbound-Windows-Client.zip
            OpenStarbound-Windows-Server.zip
        run: |
          set -uo pipefail
          missing=0

          while IFS= read -r pkg; do
            [ -n "${pkg}" ] || continue
            if [ -f "release-zips/${pkg}" ]; then
              echo "OK       ${pkg}"
            else
              echo "::error::Mandatory package missing: ${pkg}"
              missing=1
            fi
          done <<< "${REQUIRED}"

          if [ "${missing}" -ne 0 ]; then
            echo "::error::Windows packages are mandatory - aborting release, nothing will be published"
            {
              echo "## Release aborted"
              echo ""
              echo "Mandatory Windows packages are missing:"
              echo ""
              while IFS= read -r pkg; do
                [ -n "${pkg}" ] || continue
                [ -f "release-zips/${pkg}" ] || echo "- ${pkg}"
              done <<< "${REQUIRED}"
              echo ""
              echo "Inspect \`artifacts/\` and the download log above for the root cause."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

      # ---------------------------------------------------------------- release notes
      - name: Compose release notes
        shell: bash
        env:
          MESSAGE: ${{ steps.run.outputs.message }}
          OMITTED: ${{ steps.convert.outputs.omitted }}
          SHA: ${{ steps.run.outputs.sha }}
          BRANCH: ${{ steps.run.outputs.branch }}
          EVENT: ${{ steps.run.outputs.event }}
          RUN_URL: ${{ steps.run.outputs.url }}
        run: |
          set -uo pipefail
          {
            printf '%s\n\n' "${MESSAGE:-(no commit message)}"
            echo "---"
            echo ""
            echo "- Commit: \`${SHA}\`"
            echo "- From build: \`${EVENT}\` on \`${BRANCH}\`"
            echo "- Build run: ${RUN_URL}"

            if [ -n "${OMITTED}" ]; then
              echo ""
              echo "> [!WARNING]"
              echo "> The following packages are **not** included in this release:"
              echo ">"
              while IFS= read -r line; do
                if [ -n "${line}" ]; then
                  echo "> - ${line}"
                fi
              done <<< "${OMITTED}"
            fi
          } > release-notes.md
          cat release-notes.md

      # ---------------------------------------------------------------- publish
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Prefer a PAT when available; fall back to the built-in token.
          token: ${{ secrets.ACTIONS_PAT || secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ steps.run.outputs.sha }}
          name: Release ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          draft: ${{ inputs.draft == true }}
          prerelease: ${{ inputs.prerelease == true }}
          make_latest: true
          fail_on_unmatched_files: false
          files: release-zips/*.zip

      - name: Release summary
        shell: bash
        env:
          OMITTED: ${{ steps.convert.outputs.omitted }}
        run: |
          {
            echo "## Release created"
            echo ""
            echo "**Tag:** ${{ steps.tag.outputs.tag }}"
            echo "**Entry:** ${{ github.event_name }}"
            echo "**Upstream run:** ${{ steps.run.outputs.url }}"
            echo ""
            echo "| asset | size |"
            echo "|---|---|"
            for f in release-zips/*.zip; do
              [ -e "$f" ] || continue
              printf '| %s | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done

            if [ -n "${OMITTED}" ]; then
              echo ""
              echo "### Omitted packages"
              echo ""
              while IFS= read -r line; do
                if [ -n "${line}" ]; then
                  echo "- ${line}"
                fi
              done <<< "${OMITTED}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
