      - name: Upload vcpkg log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-manifest-install-log-linux-clang
          path: vcpkg-manifest-install.log
          archive: false

  # Linux ARM (GCC)
