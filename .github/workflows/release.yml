  # Release job that runs after all builds complete
  create-release:
    name: Create GitHub Release
    needs: [build_windows, build_linux, build_linux_clang, build_linux_arm, build_linux_arm_clang, build-mac-intel, build-mac-arm]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
  
      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/OpenStarbound/OpenStarbound/releases/latest | jq -r .tag_name)
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            LATEST_TAG="0.1.14"
          fi
          DATETIME=$(date -u +'%Y%m%d%H%M')
          TAG="${LATEST_TAG}.${DATETIME}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"
  
  
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-files
      - name: Install lzip
        run: sudo apt-get update && sudo apt-get install -y lzip

      - name: Convert artifacts to .zip format
        shell: bash
        run: |
          set -e
          mkdir -p ./release-zips
  

          declare -A map=(
            ["OpenStarbound-Linux-Clang-Client/OpenStarbound-Linux-Clang-Client.tar.lz"]="OpenStarbound-Linux-Clang-Client.zip"
            ["OpenStarbound-Linux-Clang-Server/OpenStarbound-Linux-Clang-Server.tar.lz"]="OpenStarbound-Linux-Clang-Server.zip"
            ["OpenStarbound-macOS-Intel-Client/OpenStarbound-macOS-Intel-Client.tar.lz"]="OpenStarbound-macOS-Intel-Client.zip"
            ["OpenStarbound-macOS-Silicon-Client/OpenStarbound-macOS-Silicon-Client.tar.lz"]="OpenStarbound-macOS-Silicon-Client.zip"
            ["OpenStarbound-Windows-Client/OpenStarbound-Windows-Client.zip"]="OpenStarbound-Windows-Client.zip"
            ["OpenStarbound-Windows-Server/OpenStarbound-Windows-Server.zip"]="OpenStarbound-Windows-Server.zip"
            ["OpenStarbound-Windows-Installer/OpenStarbound-Windows-Installer.exe"]="OpenStarbound-Windows-Installer.zip"
          )
  
          for src in "${!map[@]}"; do
            dest="${map[$src]}"
            full_src="release-files/$src"
            if [ ! -e "$full_src" ]; then
              echo "Warning: $full_src does not exist, skipping."
              continue
            fi
            echo "Processing $src -> $dest"
            if [[ "$src" == *.tar.lz ]]; then
              
              tmpdir=$(mktemp -d)
              tar -xf "$full_src" -C "$tmpdir"

              (cd "$tmpdir" && zip -r -q "$OLDPWD/release-zips/$dest" .)
              rm -rf "$tmpdir"
            elif [[ "$src" == *.exe ]]; then
              
              zip -j -q "release-zips/$dest" "$full_src"
            else
              cp "$full_src" "release-zips/$dest"
            fi
          done
  
          ls -lh release-zips/
  
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            ## Latest Changes
            
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
          files: |
            release-zips/*.zip
          allow_updates: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Release Summary
        run: |
          echo "## Release Created Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Files uploaded:** 7" >> $GITHUB_STEP_SUMMARY
