name: Build and Release

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

permissions:
  contents: write
  actions: read          

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
      && github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Show upstream run
        run: |
          {
            echo "| key | value |"
            echo "|---|---|"
            echo "| upstream run | ${{ github.event.workflow_run.id }} |"
            echo "| event | ${{ github.event.workflow_run.event }} |"
            echo "| branch | ${{ github.event.workflow_run.head_branch }} |"
            echo "| sha | ${{ github.event.workflow_run.head_sha }} |"
            echo "| conclusion | ${{ github.event.workflow_run.conclusion }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe upstream artifacts
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${{ github.event.workflow_run.id }}/artifacts" --jq '.total_count')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "upstream artifacts: $count"
          if [ "$count" -eq 0 ]; then
            echo "::warning::上游 run 没有任何 artifact，跳过发版"
          fi

      - name: Download upstream artifacts
        if: steps.probe.outputs.count != '0'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./release-files

      - name: Determine release tag
        if: steps.probe.outputs.count != '0'
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name // empty' 2>/dev/null) || latest=""
          [ -n "$latest" ] || latest="0.1.14"
          tag="${latest}.$(date -u +%Y%m%d%H%M%S).${{ github.run_number }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Install lzip
        if: steps.probe.outputs.count != '0'
        run: sudo apt-get update && sudo apt-get install -y lzip

      - name: Convert artifacts to .zip
        if: steps.probe.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"
          mkdir -p release-zips

          while IFS='|' read -r src dest; do
            [ -n "$src" ] || continue
            full="release-files/$src"
            if [ ! -e "$full" ]; then
              echo "::warning::$full not found, skipping"
              continue
            fi
            echo "Processing $src -> $dest"
            tmp=$(mktemp -d)
            case "$src" in
              *.tar.lz)
                tar --lzip -xf "$full" -C "$tmp"
                ( cd "$tmp" && zip -r -q "$root/release-zips/$dest" . )
                ;;
              *.exe)
                zip -j -q "release-zips/$dest" "$full"
                ;;
              *)
                cp "$full" "release-zips/$dest"
                ;;
            esac
            rm -rf "$tmp"
          done <<'EOF'
          OpenStarbound-Linux-Clang-Client/OpenStarbound-Linux-Clang-Client.tar.lz|OpenStarbound-Linux-Clang-Client.zip
          OpenStarbound-Linux-Clang-Server/OpenStarbound-Linux-Clang-Server.tar.lz|OpenStarbound-Linux-Clang-Server.zip
          OpenStarbound-Linux-ARM-Clang-Client/OpenStarbound-Linux-ARM-Clang-Client.tar.lz|OpenStarbound-Linux-ARM-Clang-Client.zip
          OpenStarbound-Linux-ARM-Clang-Server/OpenStarbound-Linux-ARM-Clang-Server.tar.lz|OpenStarbound-Linux-ARM-Clang-Server.zip
          OpenStarbound-Linux-GCC-Client/OpenStarbound-Linux-GCC-Client.tar.lz|OpenStarbound-Linux-GCC-Client.zip
          OpenStarbound-Linux-GCC-Server/OpenStarbound-Linux-GCC-Server.tar.lz|OpenStarbound-Linux-GCC-Server.zip
          OpenStarbound-Linux-ARM-GCC-Client/OpenStarbound-Linux-ARM-GCC-Client.tar.lz|OpenStarbound-Linux-ARM-GCC-Client.zip
          OpenStarbound-Linux-ARM-GCC-Server/OpenStarbound-Linux-ARM-GCC-Server.tar.lz|OpenStarbound-Linux-ARM-GCC-Server.zip
          OpenStarbound-macOS-Intel-Client/OpenStarbound-macOS-Intel-Client.tar.lz|OpenStarbound-macOS-Intel-Client.zip
          OpenStarbound-macOS-Silicon-Client/OpenStarbound-macOS-Silicon-Client.tar.lz|OpenStarbound-macOS-Silicon-Client.zip
          OpenStarbound-Windows-Client/OpenStarbound-Windows-Client.zip|OpenStarbound-Windows-Client.zip
          OpenStarbound-Windows-Server/OpenStarbound-Windows-Server.zip|OpenStarbound-Windows-Server.zip
          OpenStarbound-Windows-Installer/OpenStarbound-Windows-Installer.exe|OpenStarbound-Windows-Installer.zip
          EOF

          if ! ls release-zips/*.zip >/dev/null 2>&1; then
            echo "::error::没有产出任何 zip，放弃发版"
            exit 1
          fi
          ls -lh release-zips/

      - name: Create Release
        if: steps.probe.outputs.count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            ${{ github.event.workflow_run.head_commit.message }}

            ---
            - Commit: `${{ github.event.workflow_run.head_sha }}`
            - Triggered by: `${{ github.event.workflow_run.event }}` on `${{ github.event.workflow_run.head_branch }}`
            - Build run: ${{ github.event.workflow_run.html_url }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          files: release-zips/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        if: steps.probe.outputs.count != '0'
        shell: bash
        run: |
          count=$(ls -1 release-zips/*.zip | wc -l)
          {
            echo "## Release Created"
            echo ""
            echo "**Tag:** ${{ steps.tag.outputs.tag }}"
            echo "**Upstream run:** ${{ github.event.workflow_run.html_url }}"
            echo "**Assets:** ${count}"
          } >> "$GITHUB_STEP_SUMMARY"
