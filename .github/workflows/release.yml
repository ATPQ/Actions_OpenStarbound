        run: |
          do_build=true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.linux_clang }}" != "true" ]; then
            do_build=false
          fi
          echo "do_build=$do_build" >> $GITHUB_OUTPUT

      - name: Create placeholders for Linux ARM Clang (when not selected)
        if: ${{ steps.decide.outputs.do_build == 'false' }}
        shell: bash
        run: |
          mkdir -p dist
          echo "Placeholder" > OpenStarbound-Linux-ARM-Clang.tar.lz
          echo "Placeholder" > OpenStarbound-Linux-ARM-Clang-Client.tar.lz
          echo "Placeholder" > OpenStarbound-Linux-ARM-Clang-Server.tar.lz

      - name: Install Packages
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkgconf libxmu-dev libgl-dev libglu1-mesa-dev libasound2-dev libpulse-dev \
          libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
          libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
          libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev \
          autoconf autoconf-archive automake libtool patchelf tarlz

      - name: Install CMake & Ninja
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.29.2

      - uses: actions/checkout@v4
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        with:
          submodules: 'recursive'

      - name: sccache
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: ${{ github.job }}-${{ runner.os }}
          max-size: 250M

      - name: vcpkg
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgJsonGlob: '**/source/vcpkg.json'
          vcpkgConfigurationJsonGlob: '**/source/vcpkg-configuration.json'

      - name: Restore vcpkg cache
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        id: vcpkg-cache
        uses: TAServers/vcpkg-cache@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CMake
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        uses: lukka/run-cmake@v10
        env:
          VCPKG_FEATURE_FLAGS: "binarycaching"
          VCPKG_BINARY_SOURCES: "clear;files,${{ steps.vcpkg-cache.outputs.path }},readwrite"
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/source/CMakeLists.txt'
          configurePreset: 'linux-arm-release-clang'
          buildPreset: 'linux-arm-release-clang'

      - name: Prepare Artifacts
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        working-directory: ${{ github.workspace }}
        run: tarlz -c9vf OpenStarbound-Linux-ARM-Clang.tar.lz dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenStarbound-Linux-ARM-Clang
          path: OpenStarbound-Linux-ARM-Clang.tar.lz
          archive: false

      - name: Run Tests
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        uses: lukka/run-cmake@v10
        env:
          VCPKG_FEATURE_FLAGS: "binarycaching"
          VCPKG_BINARY_SOURCES: "clear;files,${{ steps.vcpkg-cache.outputs.path }},readwrite"
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/source/CMakeLists.txt'
          testPreset: 'linux-arm-release'

      - name: Assemble Files
        if: ${{ steps.decide.outputs.do_build == 'true' }}
        working-directory: ${{ github.workspace }}
        run: |
          scripts/ci/linux/assemble.sh
          mv -v client.tar.lz OpenStarbound-Linux-ARM-Clang-Client.tar.lz
          mv -v server.tar.lz OpenStarbound-Linux-ARM-Clang-Server.tar.lz

      - name: Upload Client Files
        uses: actions/upload-artifact@v4
        with:
          name: OpenStarbound-Linux-ARM-Clang-Client
          path: OpenStarbound-Linux-ARM-Clang-Client.tar.lz
          archive: false

      - name: Upload Server Files
        uses: actions/upload-artifact@v4
        with:
          name: OpenStarbound-Linux-ARM-Clang-Server
          path: OpenStarbound-Linux-ARM-Clang-Server.tar.lz
          archive: false

      - name: Collect vcpkg log
        if: always()
        run: |
          log='build/linux-arm-release/vcpkg-manifest-install.log'
          if [ -f "$log" ]; then cp "$log" vcpkg-manifest-install.log; else echo "No vcpkg manifest log found." > vcpkg-manifest-install.log; fi

      - name: Upload vcpkg log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-manifest-install-log-linux-arm-clang
          path: vcpkg-manifest-install.log
          archive: false

