name: Sync Upstream

on:
  workflow_dispatch:              
  schedule:
    - cron: '0 16 * * *'          

permissions:
  contents: write                 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.ACTIONS_PAT }}
          fetch-depth: 0         

      - name: Show times for debugging
        run: |
          echo "Runner UTC time: $(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Asia/Shanghai time (via TZ): $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Set up git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/OpenStarbound/OpenStarbound.git

      - name: Fetch upstream
        run: |
          git fetch upstream

      - name: Check for new commits
        id: check                 
        run: |
        
          if git merge-base --is-ancestor upstream/main main; then
            echo "No new commits from upstream."
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "commit_log=" >> $GITHUB_OUTPUT   
          else
            # 收集新提交（最多 10 条）
            LOG=$(git log --pretty=format:"- %h %s" main..upstream/main | head -n 10)
            COUNT=$(git rev-list --count main..upstream/main)
            if [ $COUNT -gt 10 ]; then
              LOG="${LOG}\n... and $((COUNT-10)) more commits"
            fi
            echo "skip=false" >> $GITHUB_OUTPUT
            # 多行文本写入输出
            echo "commit_log<<EOF" >> $GITHUB_OUTPUT
            echo "$LOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream changes
        if: steps.check.outputs.skip == 'false'  
        run: |
          git checkout main
         
          cat > /tmp/commit_msg <<EOF
          Merge upstream updates

          ${{ steps.check.outputs.commit_log }}
          EOF
          git merge upstream/main --no-ff -F /tmp/commit_msg
          git push origin main
